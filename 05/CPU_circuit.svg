<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c00"/>
    </marker>
    <style>
      .blk{fill:#eef4ff;stroke:#2b5797;stroke-width:2}
      .reg{fill:#e8f7ec;stroke:#1d7a3a;stroke-width:2}
      .mux{fill:#fff4e0;stroke:#c77700;stroke-width:2}
      .w{fill:none;stroke:#333;stroke-width:1.8}
      .s{fill:none;stroke:#c00;stroke-width:1.5;stroke-dasharray:4 3}
      .t{text-anchor:middle;dominant-baseline:middle}
      .lbl{fill:#c00;font-size:12px}
      .sig{fill:#222;font-weight:bold}
      .dot{fill:#333}
    </style>
  </defs>
  <rect width="1240" height="620" fill="#ffffff"/>
  <text x="620" y="22" class="t" font-size="20" font-weight="bold">Hack CPU 電路圖</text>

  <!-- ALU output feedback bus (top, y=50) -->
  <path class="w" d="M870,180 V50 H90 V105 H120" marker-end="url(#ar)"/>
  <circle class="dot" cx="870" cy="180" r="3.5"/>
  <circle class="dot" cx="470" cy="50" r="3.5"/>
  <path class="w" d="M470,50 V145 H500" marker-end="url(#ar)"/>
  <text x="300" y="42" font-size="12">ALU out（回授）</text>

  <!-- instruction -->
  <text x="10" y="128" class="sig" font-size="13">instruction[16]</text>
  <path class="w" d="M20,135 H120" marker-end="url(#ar)"/>

  <!-- Mux1 -->
  <path class="mux" d="M120,85 L230,95 L230,145 L120,155 z"/>
  <text x="175" y="120" class="t">Mux16</text>
  <text x="132" y="107" font-size="11">a</text><text x="132" y="137" font-size="11">b</text>
  <path class="s" d="M175,175 V150" marker-end="url(#arr)"/>
  <text x="175" y="188" class="t lbl">sel = isA</text>

  <!-- A register -->
  <path class="w" d="M230,120 H300" marker-end="url(#ar)"/>
  <rect class="reg" x="300" y="95" width="110" height="50" rx="6"/>
  <text x="355" y="120" class="t" font-weight="bold">A Register</text>
  <path class="s" d="M355,70 V95" marker-end="url(#arr)"/>
  <text x="355" y="64" class="t lbl">loadA = isA + isC·d1</text>

  <!-- A output -->
  <path class="w" d="M410,120 H450 V245 H500" marker-end="url(#ar)"/>
  <circle class="dot" cx="450" cy="245" r="3.5"/>
  <path class="w" d="M450,245 V430 H500" marker-end="url(#ar)"/>
  <circle class="dot" cx="450" cy="340" r="3.5"/>
  <path class="w" d="M450,340 H1225" marker-end="url(#ar)"/>
  <text x="1140" y="330" class="sig">addressM[15]</text>

  <!-- D register -->
  <rect class="reg" x="500" y="120" width="110" height="50" rx="6"/>
  <text x="555" y="145" class="t" font-weight="bold">D Register</text>
  <path class="s" d="M555,95 V120" marker-end="url(#arr)"/>
  <text x="595" y="88" class="t lbl">loadD = isC·d2</text>
  <path class="w" d="M610,145 H700" marker-end="url(#ar)"/>

  <!-- Mux2 (A or M) -->
  <text x="10" y="572" class="sig">inM[16]</text>
  <path class="w" d="M20,580 H480 V275 H500" marker-end="url(#ar)"/>
  <path class="mux" d="M500,225 L610,235 L610,285 L500,295 z"/>
  <text x="555" y="260" class="t">Mux16</text>
  <text x="512" y="247" font-size="11">a</text><text x="512" y="277" font-size="11">b</text>
  <path class="s" d="M555,312 V290" marker-end="url(#arr)"/>
  <text x="600" y="322" class="t lbl">sel = a 位元 (i[12])</text>
  <path class="w" d="M610,260 H700" marker-end="url(#ar)"/>

  <!-- ALU -->
  <path class="blk" d="M700,110 L830,140 L830,300 L700,330 L700,240 L720,220 L700,200 z"/>
  <text x="770" y="215" class="t" font-size="18" font-weight="bold">ALU</text>
  <text x="712" y="150" font-size="11">x</text><text x="712" y="264" font-size="11">y</text>
  <path class="s" d="M765,95 V125" marker-end="url(#arr)"/>
  <text x="765" y="88" class="t lbl">zx nx zy ny f no = i[11..6]（c1..c6）</text>

  <path class="w" d="M830,180 H1225" marker-end="url(#ar)"/>
  <text x="1170" y="170" class="sig">outM[16]</text>

  <!-- writeM -->
  <rect class="blk" x="960" y="215" width="170" height="36" rx="6"/>
  <text x="1045" y="233" class="t" font-size="13">writeM = isC·d3 (i[3])</text>
  <path class="w" d="M1130,233 H1225" marker-end="url(#ar)"/>
  <text x="1170" y="222" class="sig">writeM</text>

  <!-- zr / ng to jump logic -->
  <path class="w" d="M830,250 H860 V400 H900" marker-end="url(#ar)"/>
  <text x="840" y="243" font-size="12">zr</text>
  <path class="w" d="M830,285 H845 V430 H900" marker-end="url(#ar)"/>
  <text x="834" y="278" font-size="12">ng</text>

  <!-- Jump logic -->
  <rect class="blk" x="900" y="380" width="270" height="80" rx="6"/>
  <text x="1035" y="400" class="t" font-weight="bold">跳躍邏輯</text>
  <text x="1035" y="423" class="t" font-size="12">jump = isC·( j1·ng + j2·zr + j3·¬zr·¬ng )</text>
  <text x="1035" y="444" class="t" font-size="12">j1 j2 j3 = i[2] i[1] i[0]</text>
  <path class="w" d="M1035,460 V500 H555 V460" marker-end="url(#ar)"/>
  <text x="800" y="492" font-size="12">jump → PC.load</text>

  <!-- PC -->
  <rect class="reg" x="500" y="405" width="110" height="55" rx="6"/>
  <text x="555" y="432" class="t" font-weight="bold">PC</text>
  <text x="466" y="447" font-size="11">in</text>
  <text x="10" y="402" class="sig">reset</text>
  <path class="s" d="M20,410 H440 V415 H500" marker-end="url(#arr)"/>
  <text x="380" y="403" class="lbl">reset</text>
  <text x="560" y="398" class="lbl">inc = 1</text>
  <path class="w" d="M610,432 H660 V540 H1225" marker-end="url(#ar)"/>
  <text x="1170" y="530" class="sig">pc[15]</text>

  <!-- legend -->
  <rect x="20" y="210" width="300" height="160" fill="#fafafa" stroke="#bbb"/>
  <text x="32" y="232" font-weight="bold">指令解碼（i = instruction）</text>
  <text x="32" y="256" font-size="12">isA = ¬i[15]（A 指令：@value）</text>
  <text x="32" y="276" font-size="12">isC = i[15]（C 指令：dest=comp;jump）</text>
  <text x="32" y="296" font-size="12">a = i[12]（0：用 A，1：用 M）</text>
  <text x="32" y="316" font-size="12">c1..c6 = i[11..6] → ALU 控制</text>
  <text x="32" y="336" font-size="12">d1 d2 d3 = i[5] i[4] i[3]（寫 A / D / M）</text>
  <text x="32" y="356" font-size="12">j1 j2 j3 = i[2] i[1] i[0]（&lt;0 / =0 / &gt;0）</text>
</svg>
